  <div class="white-container header-card">
  <header class="dashboard-header">
    <div class="header-content">
      <!-- Title -->
      <div class="header-title">
        <h1 class="header-text">Tasmii de {{ recitation.student.fullName }}</h1>
      </div>
      <!-- Center toggle -->
      <div class="toggle-section">
        <span [class.active-mode]="!isRevision">Recitation</span>
        <mat-slide-toggle [(ngModel)]="isRevision" color="accent" class="styled-toggle"></mat-slide-toggle>
        <span [class.active-mode]="isRevision">Révision</span>
      </div>
      <div class="toggle-section">
        <span [class.active-mode]="!isTajweedSelected">selection par mot</span>
        <mat-slide-toggle [(ngModel)]="isTajweedSelected" color="primary"></mat-slide-toggle>
        <span [class.active-mode]="isTajweedSelected">selection par Tajweed lettre</span>
      </div>
      <div class="buttons-display">
      <!-- Homework button -->
      <button mat-raised-button class="blink-save-btn" (click)="openSaveRecitationModal()">
        Finaliser Recitation
      </button>
      <!-- Homework button -->
      <button mat-raised-button class="blink-homework-btn" (click)="openModalHomework()">
        Préparer Homework
      </button>
      </div>
    </div>
  </header>
</div>
