<div class="history-dropdown">
  <button mat-button class="history-toggle" (click)="toggleDropdown()">
    <mat-icon class="history-icon">history</mat-icon>
    Historique des récitations
    <mat-icon>{{ isOpen ? 'expand_less' : 'expand_more' }}</mat-icon>
  </button>

  <div [class.open]="isOpen" class="history-menu">
    <div class="recitation-item" *ngFor="let item of dummyHistory">
      <mat-icon class="history-icon">book</mat-icon>
      <div class="recitation-text">{{ item }}</div>
    </div>
  </div>
</div>
