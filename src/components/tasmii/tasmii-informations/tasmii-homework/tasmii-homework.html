<h2 class="modal-title">
  <mat-icon>menu_book</mat-icon> Homework
</h2>

<mat-form-field appearance="fill" class="surah-select">
  <mat-label>Choisir une sourate</mat-label>
  <mat-select [(ngModel)]="selectedSurah" (selectionChange)="onSurahChange()">
    <mat-option *ngFor="let surah of surahs" [value]="surah">
      {{ surah.name }}
    </mat-option>
  </mat-select>
</mat-form-field>

<div *ngIf="selectedSurah.ayahs < 30" class="ayah-tile-wrapper">
  <div
    *ngFor="let ayah of ayahList"
    class="ayah-tile"
    [class.selected]="isSelected(ayah)"
    (click)="selectAyah(ayah)">
    {{ ayah }}
  </div>
</div>

<div *ngIf="selectedSurah.ayahs >= 30" class="ayah-input-wrapper">
  <mat-form-field appearance="fill">
    <mat-label>Début</mat-label>
    <input matInput type="number" [(ngModel)]="selectedStart" [min]="1" [max]="selectedSurah.ayahs" />
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Fin</mat-label>
    <input matInput type="number" [(ngModel)]="selectedEnd" [min]="selectedStart || 1" [max]="selectedSurah.ayahs" />
  </mat-form-field>
</div>

<div class="modal-actions">
  <button class="actions-button" mat-stroked-button (click)="cancel()">Annuler</button>
  <button class="actions-button" mat-stroked-button (click)="confirm()" [disabled]="!selectedStart || !selectedEnd">
    Confirmer
  </button>
</div>
