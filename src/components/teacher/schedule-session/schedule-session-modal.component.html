<div class="modal-header">
  <h2 mat-dialog-title>
    <mat-icon>event_note</mat-icon>
    Planifier une nouvelle séance
  </h2>
</div>

<mat-dialog-content class="modal-content">
  <mat-horizontal-stepper>

    <!-- Étape 1 -->
<!-- Étape 1 -->
<mat-step class="step-content" label="Heure & Répétition">
  <form [formGroup]="step1Form" class="step-content">

    <!-- 🔤 Titre de la séance -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Titre de la séance</mat-label>
      <input matInput formControlName="title" placeholder="Entrez un titre pour la séance">
    </mat-form-field>

    <!-- 📅 Date de la séance -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Date de la séance</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="sessionDate">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <!-- 🕓 Heure de la séance -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Heure de la séance</mat-label>
      <input matInput type="time" formControlName="startTime">
    </mat-form-field>

    <!-- 🔁 Récurrence -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Récurrence</mat-label>
      <mat-select formControlName="recurrence">
        <mat-option *ngFor="let r of recurrenceOptions" [value]="r.value">
          {{ r.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- 📆 Jusqu'à fin d'année + date de fin -->
    <div class="inline-row">
      <mat-checkbox class="to-end-checkbox" formControlName="toEndOfYear">
        Jusqu'à fin d'année
      </mat-checkbox>

      <mat-form-field appearance="outline" class="tasmii-end-date">
        <mat-label>Date de fin (Tasmii)</mat-label>
        <input
          matInput
          [matDatepicker]="endDatePicker"
          formControlName="endTime"
          [disabled]="step1Form.get('toEndOfYear')?.value"
        />
        <mat-datepicker-toggle
          matSuffix
          [for]="endDatePicker"
          [disabled]="step1Form.get('toEndOfYear')?.value"
        ></mat-datepicker-toggle>
        <mat-datepicker #endDatePicker></mat-datepicker>
      </mat-form-field>
    </div>

  </form>
</mat-step>


    <!-- Étape 2 -->
    <mat-step class="step-content" label="Sélectionner les élèves">
      <div class="step-content">

        <!-- 🔍 Barre de recherche -->
        <div class="single-row full-width">
  <!-- Rechercher un élève -->
  <mat-form-field appearance="outline" class="half-width">
    <mat-label>Rechercher un élève</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Tapez un nom..." />
  </mat-form-field>

  <!-- Filtrer par professeur -->
  <mat-form-field appearance="outline" class="half-width">
    <mat-label>Filtrer par professeur</mat-label>
    <input matInput (keyup)="applyProfessorFilter($event)" placeholder="Nom du professeur..." />
  </mat-form-field>
</div>

        <div class="table-container">
          <!-- 🧑‍🎓 Tableau des élèves -->
          <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 full-width">

            <!-- Colonne sélection -->
            <ng-container matColumnDef="select">
              <th mat-header-cell *matHeaderCellDef>
                <mat-checkbox
                  (change)="toggleAllRows()"
                  [checked]="isAllSelected()"
                  [indeterminate]="selection.hasValue() && !isAllSelected()">
                </mat-checkbox>
              </th>
              <td mat-cell *matCellDef="let row">
                <mat-checkbox
                  (click)="$event.stopPropagation()"
                  (change)="selection.toggle(row)"
                  [checked]="selection.isSelected(row)">
                </mat-checkbox>
              </td>
            </ng-container>

            <!-- Image -->
            <ng-container matColumnDef="profile">
              <th mat-header-cell *matHeaderCellDef> Photo </th>
              <td mat-cell *matCellDef="let row">
                <img [src]="row.profileImageUrl || defaultProfileImage"
                     alt="profil"
                     width="32"
                     height="32"
                     style="border-radius: 50%; object-fit: cover;">
              </td>
            </ng-container>

            <!-- Nom -->
            <ng-container matColumnDef="fullName">
              <th mat-header-cell *matHeaderCellDef> Nom complet </th>
              <td mat-cell *matCellDef="let row"> {{ row.fullName }} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>

        <!-- Pagination -->
        <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
      </div>
    </mat-step>

    <!-- Étape 3 -->
    <mat-step class="step-content" label="Emploi du temps">
      <div class="step-content">
        <app-student-time-line
          [selectedStudents]="selection.selected"
          [selectedStartTime]="step1Form.value.startTime">
        </app-student-time-line>
      </div>
    </mat-step>

  </mat-horizontal-stepper>
</mat-dialog-content>

<mat-dialog-actions class="modal-actions">
  <button mat-button (click)="onCancel()">
    <mat-icon>close</mat-icon>
    Annuler
  </button>
  <button mat-raised-button color="primary" (click)="onSubmit()">
    <mat-icon>event</mat-icon>
    Planifier la séance
  </button>
</mat-dialog-actions>
