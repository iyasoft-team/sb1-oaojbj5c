<div class="modal-header">
  <h2 mat-dialog-title>
    <mat-icon>event_note</mat-icon>
    {{ translations.editsessionDay }}
  </h2>
</div>

<mat-dialog-content class="modal-content">
<mat-horizontal-stepper>
  <!-- Step 1 -->
<mat-step  class="step-content" label="Time & Recurrence">
  <form [formGroup]="step1Form" class="step-content">

<!-- Date Picker -->
<mat-form-field appearance="outline" class="full-width">
  <mat-label>Session Date</mat-label>
  <input matInput [matDatepicker]="picker" formControlName="sessionDate">
  <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
  <mat-datepicker #picker></mat-datepicker>
</mat-form-field>

<!-- Time Picker -->
<mat-form-field appearance="outline" class="full-width">
  <mat-label>Session Time</mat-label>
  <input matInput type="time" formControlName="sessionTime">
</mat-form-field>



    <!-- <mat-form-field appearance="outline" class="full-width">
      <mat-label>End Time</mat-label>
      <input matInput type="time" formControlName="endTime">
    </mat-form-field> -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Recurrence</mat-label>
        <mat-select formControlName="recurrence">
        <mat-option *ngFor="let r of recurrenceOptions" [value]="r.value">
          {{ r.label }}
        </mat-option>
  </mat-select>
    </mat-form-field>
    <mat-checkbox class="year-checkbox"  formControlName="toEndOfYear">To End of Year</mat-checkbox>

<mat-form-field appearance="outline" class="full-width">
  <mat-label>Fin de Classe Tasmii</mat-label>
  <input
    matInput
    [matDatepicker]="picker"
    formControlName="endTime"
    [disabled]="step1Form.get('toEndOfYear')?.value"
  />
  <mat-datepicker-toggle
    matSuffix
    [for]="picker"
    [disabled]="step1Form.get('toEndOfYear')?.value"
  ></mat-datepicker-toggle>
  <mat-datepicker #picker></mat-datepicker>
</mat-form-field>


  </form>
</mat-step>


  <!-- Step 2 -->
<mat-step class="step-content" label="Select Students">
  <div class="step-content">

    <!-- 🔍 Search bar -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Search students</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Type a name..." />
    </mat-form-field>
    <div class="table-container">
    <!-- 🧑‍🎓 Student Table -->
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 full-width">

      <!-- Checkbox Column -->
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox
            (change)="toggleAllRows()"
            [checked]="isAllSelected()"
            [indeterminate]="selection.hasValue() && !isAllSelected()">
          </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox
            (click)="$event.stopPropagation()"
            (change)="selection.toggle(row)"
            [checked]="selection.isSelected(row)">
          </mat-checkbox>
        </td>
      </ng-container>

      <!-- Profile Image Column -->
      <ng-container matColumnDef="profile">
        <th mat-header-cell *matHeaderCellDef> Profile </th>
        <td mat-cell *matCellDef="let row">
          <img [src]="row.profileImageUrl || defaultProfileImage"
               alt="profile"
               width="32"
               height="32"
               style="border-radius: 50%; object-fit: cover;">
        </td>
      </ng-container>

      <!-- Full Name Column -->
      <ng-container matColumnDef="fullName">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let row"> {{ row.fullName }} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    </div>
    <!-- Pagination -->
    <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>

  </div>


</mat-step>



  <!-- Step 3 -->
<!-- student-timeline.component.html -->
<mat-step class="step-content" label="Timeline">
  <div class="step-content">
    <app-student-time-line
      [selectedStudents]="selection.selected"
      [selectedStartTime]="step1Form.value.startTime">
    </app-student-time-line>  
</div> 
</mat-step>
</mat-horizontal-stepper>


</mat-dialog-content>

<mat-dialog-actions class="modal-actions">
  <button mat-button (click)="onCancel()">
    <mat-icon>close</mat-icon>
    {{ translations.cancel }}
  </button>
  <button mat-raised-button color="primary" (click)="onSubmit()" >
    <mat-icon>event</mat-icon>
    {{ translations.scheduleSession }}
  </button>
</mat-dialog-actions>
